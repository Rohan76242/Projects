[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "z3ro-assistant"
version = "1.0.0"
description = "Autonomous Windows AI Voice & Computer Control Assistant"
readme = "README.md"
authors = [
    { name = "Rohan", email = "rohannisra122@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.30.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
    "faster-whisper>=1.0.0",
    "edge-tts>=7.0.0",
    "pyttsx3>=2.90",
    "Pillow>=9.5.0",
    "pyautogui>=0.9.54",
    "PyGetWindow>=0.0.9",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
cloud = [
    "google-genai>=0.1.1",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
name = "name:main"
z3ro = "name:main"
sobia = "name:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["z3ro*"]
